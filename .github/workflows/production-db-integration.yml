name: production-db-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/jobs/**"
      - "tests/test_production_db_ci.py"
      - ".github/workflows/production-db-integration.yml"

jobs:
  production-db:
    runs-on: ubuntu-latest
    if: ${{ secrets.PATCHPROOF_DATABASE_URL != '' }}
    env:
      PATCHPROOF_DATABASE_URL: ${{ secrets.PATCHPROOF_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q -m integration
