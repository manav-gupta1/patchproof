[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patchproof"
version = "0.1.0"
description = "Evidence-first automated security remediation platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5,<6",
  "celery[redis]>=5.4,<6",
  "typer>=0.15,<1",
  "structlog>=25,<26",
  "cryptography>=43,<51",
  "tree-sitter>=0.25,<1",
  "tree-sitter-python>=0.25,<1",
  "tree-sitter-javascript>=0.25,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "semgrep>=1.100,<2",
]

[project.scripts]
patchproof = "packages.core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
norecursedirs = ["historical", "fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.vercel]
entrypoint = "apps.api.main:app"
