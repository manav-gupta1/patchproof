services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: patchproof_staging
      POSTGRES_USER: patchproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a staging password}
    volumes:
      - staging_pg:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7
    networks: [backend]

  api:
    build: ..
    environment:
      PATCHPROOF_DATABASE_URL: ${PATCHPROOF_DATABASE_URL}
      PATCHPROOF_REDIS_URL: redis://redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
    secrets: [github_private_key]
    depends_on: [postgres, redis]
    networks: [backend, ingress]

  worker:
    build: ..
    command: celery -A packages.jobs.celery_app:celery_app worker --loglevel=INFO
    environment:
      PATCHPROOF_DATABASE_URL: ${PATCHPROOF_DATABASE_URL}
      PATCHPROOF_REDIS_URL: redis://redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
    secrets: [github_private_key]
    depends_on: [postgres, redis]
    networks: [backend]

networks:
  backend:
    internal: true
  ingress:

secrets:
  github_private_key:
    file: ${GITHUB_PRIVATE_KEY_FILE:?set path to staging GitHub App private key}

volumes:
  staging_pg:
